name: Monthly data refresh

# Polite batch job: runs once a month, downloads each source once, commits the
# rebuilt data/processed (Railway redeploys on push) and opens an issue if a check trips.
on:
  schedule:
    - cron: "0 6 2 * *"   # 06:00 UTC on the 2nd, after BIS publishes the prior month
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-pipeline.txt

      - name: Fetch sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        working-directory: pipeline
        run: python fetch_raw.py --force

      - name: Rebuild datasets
        working-directory: pipeline
        run: |
          python build_regimes.py
          python build_episodes.py
          python build_gcc.py
          python build_screen.py
          python build_downloads.py

      - name: Run checks
        id: checks
        working-directory: pipeline
        run: python check_alerts.py

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "peg-breaks-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
          else
            git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue if a check tripped
        if: steps.checks.outputs.has_alerts == 'true'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.checks.outputs.summary }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        with:
          script: |
            const body = [
              'The monthly refresh flagged the following:',
              '',
              process.env.SUMMARY,
              '',
              `Data committed: ${process.env.CHANGED}`,
              '',
              'Check the Gulf page and, if the picture has moved, update `data/curated/current.json`.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Peg monitor alerts — ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ['monitoring'],
            });
